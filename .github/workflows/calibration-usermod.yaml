name: Build calibration usermod

on:
  push:
    branches:
      - build/independent-tool-calibration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calibration-usermod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository_owner == 'cheekyb52'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      CI: '1'
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build firmware development image
        uses: docker/build-push-action@v6
        with:
          context: .github/dev
          load: true
          tags: snapmaker-u1-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load firmware variables and identify personal build
        shell: bash
        run: |
          set -euo pipefail
          cat vars.mk >> "$GITHUB_ENV"
          base_version=$(sed -n 's/^FIRMWARE_VERSION=//p' vars.mk)
          echo "GIT_VERSION=${base_version}-cheekyb52-calibration-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Restore original firmware download
        uses: actions/cache@v4
        with:
          path: firmware/${{ env.FIRMWARE_FILE }}
          key: calibration-firmware-${{ env.FIRMWARE_SHA256 }}

      - name: Restore kernel build cache
        uses: actions/cache@v4
        with:
          path: tmp/kernel/
          key: calibration-kernel-${{ runner.os }}-${{ runner.arch }}-${{ env.KERNEL_SHA }}

      - name: Build tools
        run: ./dev.sh make tools

      - name: Download and verify original firmware
        run: ./dev.sh make firmware

      - name: Build extended firmware with calibration usermod
        run: ./dev.sh make build PROFILE=extended-cheeky_b52 OUTPUT_FILE=firmware/U1_calibration.bin

      - name: Unpack generated firmware
        run: ./dev.sh scripts/helpers/unpack_firmware.sh "$PWD/firmware/U1_calibration.bin" "$PWD/tmp/calibration-verification"

      - name: Verify five files from the packed image
        shell: bash
        run: |
          ./dev.sh python3 -B -c '
          import hashlib, pathlib, subprocess
          expected = {
              "home/lava/klipper/klippy/kinematics/extruder.py": "da375bfb97d065a1511829ae1f0d3d44531b18c4c39246439812a8989ceb5cae",
              "home/lava/klipper/klippy/extras/extruder_config_bak.py": "21cb0c7037eb0c2ee195704e8e81dfd5fad307ff5cb16a0c3ed981b006d0f302",
              "home/lava/klipper/klippy/extras/probe_inductance_coil.py": "05196461cea7160eb9ffee5907a2332d12d1740349d8e65b1f3d7671fca545c8",
              "home/lava/klipper/klippy/queuefile.py": "fce61a3256e376b566b8676c8b95f9c3082846881995af8cb0369af581938157",
              "usr/local/share/firmware-config/extended/klipper/70_tool_offsets.cfg": "5d73c5f489bccd124a6343f8b32968d52f29f8ab353cc45607f0ba556ac42ccd",
          }
          image = "tmp/calibration-verification/rk-unpacked/rootfs.img"
          lines = []
          for name, digest in expected.items():
              content = subprocess.check_output(["unsquashfs", "-cat", image, name])
              assert hashlib.sha256(content).hexdigest() == digest, name
              if name.endswith(".py"):
                  compile(content, name, "exec")
              lines.append(digest + "  " + name)
          pathlib.Path("firmware/payload-sha256.txt").write_text("\n".join(lines) + "\n")
          print("All five packed-image payload checks passed")
          '

      - name: Record firmware checksum and build identity
        shell: bash
        run: |
          set -euo pipefail
          cd firmware
          sha256sum U1_calibration.bin > U1_calibration.bin.sha256
          printf 'profile=extended-cheeky_b52\nsource_commit=%s\nversion=%s\n' "$GITHUB_SHA" "$GIT_VERSION" > build-info.txt

      - name: Upload firmware and verification records
        uses: actions/upload-artifact@v4
        with:
          name: calibration-usermod-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            firmware/U1_calibration.bin
            firmware/U1_calibration.bin.sha256
            firmware/payload-sha256.txt
            firmware/build-info.txt
