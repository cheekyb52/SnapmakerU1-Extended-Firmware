name: Build calibration usermod

on:
  push:
    branches:
      - build/independent-tool-calibration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calibration-usermod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository_owner == 'cheekyb52'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      CI: '1'
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build firmware development image
        uses: docker/build-push-action@v6
        with:
          context: .github/dev
          load: true
          tags: snapmaker-u1-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load firmware variables and identify personal build
        shell: bash
        run: |
          set -euo pipefail
          cat vars.mk >> "$GITHUB_ENV"
          base_version=$(sed -n 's/^FIRMWARE_VERSION=//p' vars.mk)
          echo "GIT_VERSION=${base_version}-cheekyb52-calibration-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Restore original firmware download
        uses: actions/cache@v4
        with:
          path: firmware/${{ env.FIRMWARE_FILE }}
          key: calibration-firmware-${{ env.FIRMWARE_SHA256 }}

      - name: Restore kernel build cache
        uses: actions/cache@v4
        with:
          path: tmp/kernel/
          key: calibration-kernel-${{ runner.os }}-${{ runner.arch }}-${{ env.KERNEL_SHA }}

      - name: Reject Windows line endings in usermod scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path("overlays/mods/cheeky_b52").rglob("*.sh"):
              assert b"\r" not in path.read_bytes(), str(path)
          print("Usermod shell scripts use Unix line endings")
          PY

      - name: Build tools
        run: ./dev.sh make tools

      - name: Download and verify original firmware
        run: ./dev.sh make firmware

      - name: Verify original firmware container round trips
        run: ./dev.sh make test

      - name: Build extended firmware with calibration usermod
        run: ./dev.sh make build PROFILE=extended-cheeky_b52 OUTPUT_FILE=firmware/U1_calibration.bin

      - name: Unpack generated firmware
        run: ./dev.sh scripts/helpers/unpack_firmware.sh "$PWD/firmware/U1_calibration.bin" "$PWD/tmp/calibration-verification"

      - name: Verify six files from the packed image
        shell: bash
        run: |
          ./dev.sh python3 -B -c '
          import hashlib, pathlib, subprocess
          expected = {
              "home/lava/klipper/klippy/kinematics/extruder.py": "da375bfb97d065a1511829ae1f0d3d44531b18c4c39246439812a8989ceb5cae",
              "home/lava/klipper/klippy/extras/extruder_config_bak.py": "21cb0c7037eb0c2ee195704e8e81dfd5fad307ff5cb16a0c3ed981b006d0f302",
              "home/lava/klipper/klippy/extras/probe_inductance_coil.py": "05196461cea7160eb9ffee5907a2332d12d1740349d8e65b1f3d7671fca545c8",
              "home/lava/klipper/klippy/extras/print_task_config.py": "1ef6e8ade716fab99715e00e58502016197f43d3147620018a34c681e9d312eb",
              "home/lava/klipper/klippy/queuefile.py": "fce61a3256e376b566b8676c8b95f9c3082846881995af8cb0369af581938157",
              "usr/local/share/firmware-config/extended/klipper/70_tool_offsets.cfg": "ea4733329ae5575a5b42d26284f8d79178f5153bdb2cbe832907df749625cde0",
          }
          original = pathlib.Path("tools/tmp/test")
          packed = pathlib.Path("tmp/calibration-verification")
          for name in ("UPFILE_MAGIC_VER", "UPFILE_EXT", "gd32h757.bin"):
              assert (original / name).read_bytes() == (packed / name).read_bytes(), name
          print("Original header version and extra MCU payload preserved")
          image = "tmp/calibration-verification/rk-unpacked/rootfs.img"
          lines = []
          for name, digest in expected.items():
              content = subprocess.check_output(["unsquashfs", "-cat", image, name])
              assert hashlib.sha256(content).hexdigest() == digest, name
              if name.endswith(".py"):
                  compile(content, name, "exec")
              lines.append(digest + "  " + name)
          pathlib.Path("firmware/payload-sha256.txt").write_text("\n".join(lines) + "\n")
          cleanup = subprocess.check_output(["unsquashfs", "-cat", image, "usr/local/share/firmware-config/force-cleanup.sha256"]).decode()
          assert "5d73c5f489bccd124a6343f8b32968d52f29f8ab353cc45607f0ba556ac42ccd  klipper/70_tool_offsets.cfg" in cleanup.splitlines()
          print("All six packed-image payload checks and stock CFG migration entry passed")
          '

      - name: Record firmware checksum and build identity
        shell: bash
        run: |
          ./dev.sh bash -euo pipefail -c '
          cd firmware
          sha256sum U1_calibration.bin > U1_calibration.bin.sha256
          printf "profile=extended-cheeky_b52\nsource_commit=%s\nversion=%s\n" "$(git rev-parse HEAD)" "$GIT_VERSION" > build-info.txt
          cp ../overlays/mods/cheeky_b52/README.md TESTING.md
          cp ../overlays/mods/cheeky_b52/NOTICE.md NOTICE.md
          cp ../LICENSE LICENSE
          cp ../overlays/mods/cheeky_b52/02-macros/root/usr/local/share/firmware-config/extended/klipper/70_tool_offsets.cfg 70_tool_offsets.cfg
          '

      - name: Upload firmware and verification records
        uses: actions/upload-artifact@v4
        with:
          name: calibration-usermod-${{ github.run_number }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            firmware/U1_calibration.bin
            firmware/U1_calibration.bin.sha256
            firmware/payload-sha256.txt
            firmware/build-info.txt
            firmware/TESTING.md
            firmware/NOTICE.md
            firmware/LICENSE
            firmware/70_tool_offsets.cfg

  publish:
    name: Publish experimental test build
    needs: build
    if: github.repository == 'cheekyb52/SnapmakerU1-Extended-Firmware'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified build assets
        uses: actions/download-artifact@v4
        with:
          name: calibration-usermod-${{ github.run_number }}-${{ github.run_attempt }}
          path: release-assets

      - name: Check downloaded firmware checksum
        working-directory: release-assets
        run: sha256sum --check U1_calibration.bin.sha256

      - name: Publish personal testing prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: cheekyb52/SnapmakerU1-Extended-Firmware
        run: |
          set -euo pipefail
          tag="calibration-test-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          notes_file="$RUNNER_TEMP/calibration-release-notes.md"
          cat > "$notes_file" <<'NOTES'
          Experimental community test build of the independent tool calibration usermod.

          - Press T1/T2/T3 directly to start; separate backup arming is optional and disabled by default. Independent saves preserve the other three tools and shared reference.
          - T0 displays a warning to use stock four-tool calibration.
          - Clean/validate checks all six tool pairs without saving calibration.
          - The mixed-nozzle print-start workaround is baked into print_task_config.py; it removes only the faulty diameter comparison and retains volume/material checks.

          The calibration native payload and CFG 0.1.1 are unchanged. This image adds the separately guarded mixed-nozzle workaround, with eight actual-validation checks run during the build. All six payload files were independently verified from the packed firmware. Earlier calibration evidence includes 96 offline checks and one-printer live acceptance of the prior payload. This integrated image and the newer CFG still require their own hardware acceptance; wider coverage is being collected.

          Read TESTING.md and obtain verified configuration/native backups before installation. Flashing this build updates an unmodified packaged CFG 0.1.0 automatically using stock checksum cleanup. Custom CFGs are preserved and need review against the new .default. The mixed-nozzle Python change requires the full firmware image; the CFG alone cannot apply it. For the separate button-start macro update, existing calibration-test-2-1 users can update the attached 70_tool_offsets.cfg without reflashing: back up the existing CFG/calibration data, review the CFG diff, replace extended/klipper/70_tool_offsets.cfg and restart Klipper while idle. The default calibration buttons do not require OFFSET_ARM_SAVE. Keep the actual nozzle sizes correctly configured in both printer and slicer: the faulty print-start diameter check is disabled. Use temperatures appropriate for the loaded material. No debug/factory mode is required.

          Full instructions, exact source profiles, test results and rollback guidance:
          https://github.com/cheekyb52/Snapmaker-U1-Single-Tool-Calibration

          Report results and issues in the standalone calibration repository, including firmware build, tool tested and any error text. Exclude credentials, device addresses and raw calibration tables. Upstream submission is deferred while community testing is collected.
          NOTES
          printf '\nBuild source commit: `%s`\n' "$GITHUB_SHA" >> "$notes_file"
          gh release create "$tag" \
            release-assets/U1_calibration.bin \
            release-assets/U1_calibration.bin.sha256 \
            release-assets/payload-sha256.txt \
            release-assets/build-info.txt \
            release-assets/TESTING.md \
            release-assets/NOTICE.md \
            release-assets/LICENSE \
            release-assets/70_tool_offsets.cfg \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "Independent tool calibration + mixed nozzles — experimental test build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes-file "$notes_file" \
            --prerelease --latest=false
